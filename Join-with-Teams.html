<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoom — Secure Access</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:#ffffff;min-height:100vh}

.vz-bot-gate{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;background:#ffffff;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;color:#323130;overflow:auto}
.vz-bot-gate.hidden{display:none!important}
.vz-bot-top{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid #eee;background:#fff;color:#605e5c}
.vz-bot-crumb{font-size:13px;color:#605e5c}
.vz-bot-status{display:flex;align-items:center;gap:8px;font-size:13px;color:#605e5c}
.vz-bot-dot{width:8px;height:8px;border-radius:50%;background:#107c10;box-shadow:0 0 0 3px rgba(16,124,16,.2)}
.vz-bot-main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.vz-bot-card{width:100%;max-width:420px;background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);border:1px solid #e8e8e8;border-top:3px solid #2d8cff;overflow:hidden}

.vz-bot-body{padding:32px;text-align:center}

.vz-bot-body .vz-brand{margin:0 auto 20px;display:flex;justify-content:center;align-items:center;width:100%}
.vz-bot-body .vz-brand .brand-logo{height:28px;width:auto;max-width:160px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;line-height:0}
.vz-bot-body .vz-brand .brand-logo svg{height:28px;width:auto;max-width:160px;display:block}
.vz-bot-body .vz-brand .brand-logo img.brand-logo-img{height:28px;width:auto;max-width:160px;object-fit:contain;display:block}
.vz-bot-body .vz-brand .brand-logo.brand-logo-custom{height:36px;max-width:200px}
.vz-bot-body .vz-brand .brand-logo.brand-logo-custom svg{height:36px;max-width:200px}
.vz-bot-body .vz-brand .brand-logo.brand-logo-custom img.brand-logo-img,
.vz-bot-body .vz-brand .brand-logo.brand-logo-custom img.brand-logo-img-custom{height:36px;width:auto;max-width:200px;object-fit:contain;display:block}
.vz-bot-body .vz-ctx{margin-bottom:16px}
.vz-bot-body .vz-ctx-doc{font-size:15px;font-weight:600;margin-bottom:4px;color:#323130}
.vz-bot-body .vz-ctx-org{font-size:13px;color:#605e5c;margin-bottom:4px}
.vz-bot-desc{font-size:14px;line-height:1.5;color:#605e5c;margin:0 0 20px}
.vz-bot-btn{width:100%;background:#2d8cff;color:#fff;border:none;padding:14px 20px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s}
.vz-bot-btn:hover{background:#1a6fd4}
.vz-bot-btn:active{transform:scale(.99)}
.vz-bot-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:14px 32px;border-top:1px solid #eee;font-size:11px;color:#a19f9d
.vz-bot-shield{display:flex;align-items:center;gap:6px}
@media(max-width:600px){.vz-bot-head,.vz-bot-body,.vz-bot-foot{padding-left:20px;padding-right:20px}.vz-bot-crumb{font-size:11px}.vz-bot-foot{flex-direction:column;align-items:flex-start}}
#r{display:none}
</style></head><body>
