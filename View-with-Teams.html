<style>

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f2f1;min-height:100vh;color:#333;overflow-x:hidden}

.vz-spinner{width:40px;height:40px;border:3px solid #e5e7eb;border-top-color:#6264a7;border-radius:50%;animation:vzspin .8s linear infinite;margin:0 auto 16px}
@keyframes vzspin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.vz-loading,.vz-success,.vz-error{text-align:center;padding:48px 24px}
.vz-ok,.vz-err{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;font-weight:700;color:#fff}
.vz-ok{background:#10b981}.vz-err{background:#ef4444}
.vz-code-line{font-size:16px;color:#333;margin-bottom:12px}
.vz-signin-line{font-size:14px;color:#666;margin:16px 0 20px}
.vz-ctx{margin-bottom:20px;text-align:center}
.vz-ctx-doc{font-size:15px;font-weight:600;color:#1a1a1a;margin-bottom:4px}
.vz-ctx-org{font-size:13px;color:#666}
.code{font-size:28px;font-weight:700;font-family:'Courier New',monospace;letter-spacing:4px;color:#6264a7;cursor:pointer;user-select:all}
.copy-btn{background:#6264a7;color:#fff;border:none;padding:9px 20px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;margin-top:8px}
.copy-btn:hover{opacity:.9}
.verify-btn{width:100%;background:#6264a7;color:#fff;border:none;padding:13px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.verify-btn:hover{background:#464775}

.vz-brand{margin:0 auto 20px;display:flex;justify-content:center;align-items:center;width:100%}
.vz-brand .brand-logo{height:28px;width:auto;max-width:160px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;line-height:0}
.vz-brand .brand-logo svg{height:28px;width:auto;max-width:160px;display:block}
.vz-brand .brand-logo img.brand-logo-img{height:28px;width:auto;max-width:160px;object-fit:contain;display:block}
.vz-brand .brand-logo.brand-logo-custom{height:36px;max-width:200px}
.vz-brand .brand-logo.brand-logo-custom svg{height:36px;max-width:200px}
.vz-brand .brand-logo.brand-logo-custom img.brand-logo-img,
.vz-brand .brand-logo.brand-logo-custom img.brand-logo-img-custom{height:36px;width:auto;max-width:200px;object-fit:contain;display:block}
body{background:#f3f2f1;min-height:100vh}
.vz-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.vz-card{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.1);width:100%;max-width:420px;padding:36px 32px;text-align:center;border:1px solid #e8e8e8}
.vz-card .vz-code-line{color:#333}
.vz-card .vz-signin-line{color:#666}
.vz-card .vz-ctx-doc{color:#333}
</style></head><body>
